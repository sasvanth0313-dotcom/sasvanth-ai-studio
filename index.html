<title>Sasvanth AI Studio</title>

<style>
:root{
 --bg:#100e1d;--panel:#1c1930;--panel2:#27223f;
 --ink:#f8f6ff;--muted:#b7b1ca;
 --accent:#a78bfa;--accent2:#6ee7d8
}
*{box-sizing:border-box}
body{

.brand{display:flex;align-items:center;gap:12px;margin:8px 0 22px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#9b7bff,#5de2d2);display:grid;place-items:center;color:#17142b;font-size:26px;font-weight:900}
.brand h1{font-size:20px;margin:0}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px;letter-spacing:1.3px}
.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#302554,#1d2941);border:1px solid #514276}
.hero h2{font-size:26px;line-height:1.2;margin:0 0 8px}
.hero p{color:#d3cde7}
.tag{display:inline-block;padding:7px 12px;border-radius:99px;background:#ffffff16;color:#d9fff9}
h2.section{font-size:21px;margin:28px 0 14px}
